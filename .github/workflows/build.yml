name: Build Check

on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Test release preflight
        run: bash .github/scripts/release-preflight.test.sh
      - name: Test build safety
        run: bash .github/scripts/build-safety.test.sh
      - name: Select latest Xcode (Swift 6.2+)
        id: select_xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          swift --version
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          CACHE_VERSION="$(printf '%s' "$XCODE_VERSION" | shasum -a 256 | awk '{print $1}')"
          printf 'cache-version=%s\n' "$CACHE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Restore SwiftPM cache
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: SourcePackages
          key: spm-sourcepackages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.select_xcode.outputs.cache-version }}-${{ hashFiles('OpenSuperMLX.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'patches/**/*.patch', 'Scripts/resolve_and_patch.sh') }}
          restore-keys: |
            spm-sourcepackages-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.select_xcode.outputs.cache-version }}-
      - name: Install dependencies
        run: brew install cmake libomp rust
      - name: Set up Ruby (for xcpretty)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - name: Install xcpretty
        run: gem install xcpretty
      - name: Make run.sh executable
        run: chmod +x ./run.sh
      - name: Resolve SPM packages and apply patches
        run: |
          chmod +x ./Scripts/resolve_and_patch.sh
          ./Scripts/resolve_and_patch.sh
      - name: Save SwiftPM cache
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: SourcePackages
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}
      - name: Build with run.sh
        run: ./run.sh build 
      - name: Run unit tests (hostless)
        run: |
          set -o pipefail
          xcodebuild test -scheme OpenSuperMLX \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:OpenSuperMLXUnitTests 2>&1 | xcpretty
      - name: Run integration tests (hosted)
        run: |
          set -o pipefail
          xcodebuild test -scheme OpenSuperMLX \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:OpenSuperMLXTests \
            -skip-testing:OpenSuperMLXTests/BenchmarkTests \
            -skip-testing:OpenSuperMLXTests/StreamingE2ETests \
            -skip-testing:OpenSuperMLXTests/JapaneseGarblingRegressionTests \
            -skip-testing:OpenSuperMLXTests/MicrophoneInventoryTests \
            -skip-testing:OpenSuperMLXTests/StreamingAudioServiceGraphTests \
            -skip-testing:OpenSuperMLXTests/KeyboardLayoutProviderTests 2>&1 | xcpretty
